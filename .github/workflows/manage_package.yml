name: Manage Package

on:
  release:
    types: [published]

  # Manual unlisting. It shares this file with publishing because the nuget.org
  # Trusted Publishing policy for this repository names manage_package.yml, and a
  # policy matches exactly one workflow file. One file keeps it to one policy per repo.
  workflow_dispatch:
    inputs:
      package_id:
        description: "NuGet package ID to unlist (e.g., Hyperbee.Json)"
        required: true
        type: string
      package_version:
        description: "Exact version to unlist (e.g., 1.2.3)"
        required: true
        type: string
      dry_run:
        description: "Sign in and stop before unlisting"
        required: false
        default: true
        type: boolean

run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('Unlist · {0} · {1}', inputs.package_id, inputs.package_version)
      || format('Pack and Publish · {0}', github.event.release.tag_name) }}

permissions:
  contents: write
  pull-requests: write
  packages: write
  statuses: write

jobs:
  # The release path. Gating set-config skips tests and publish as well, because
  # they need it; a manual run reaches only the unlist job.
  set-config:
    if: github.event_name == 'release'
    uses: Stillpoint-Software/shared-workflows/.github/workflows/determine_build_configuration.yml@main
    with:
      trigger: release
      target_branch: ${{ github.event.release.target_commitish }}
      override_build_configuration: ''
      prerelease: ${{ github.event.release.prerelease }} # true/false from the release

  tests:
    needs: set-config
    uses: Stillpoint-Software/shared-workflows/.github/workflows/run_tests.yml@main
    with:
      branch: ${{ github.event.release.target_commitish }}
      solution_name: ${{ vars.SOLUTION_NAME }}
      # Keep in step with <TargetFrameworks> in Directory.Build.props.
      # netstandard2.1 is built but not tested: it has no test host.
      frameworks: '["net11.0", "net10.0"]'

  publish:
    needs: [set-config, tests]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Trusted Publishing swaps a GitHub OIDC token for a short-lived NuGet key, and
      # the token has to be minted in THIS repository's job, because that is the
      # identity nuget.org matches against its trust policy. Running the publish as a
      # reusable workflow would stamp the shared repo's identity on the token instead,
      # which is why the steps arrive as a composite action rather than `uses:` on the
      # job. Permissions can only be reduced down a call chain, so this has to be
      # granted here.
      id-token: write

    steps:
      # fetch-depth: 0 because nbgv needs history to compute the version.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: Stillpoint-Software/shared-workflows/.github/actions/pack-and-publish@main
        with:
          solution_name: ${{ vars.SOLUTION_NAME }}
          build_configuration: ${{ needs.set-config.outputs.build_configuration }}
          # The 11.0 SDK is required to pack the net11.0 target framework.
          dotnet_version: |
            11.0.x
            10.0.x
          # When NUGET_USER is unset the action falls back to the API key, so this is
          # inert until a Trusted Publishing policy exists on nuget.org.
          nuget_user: ${{ secrets.NUGET_USER }}
          nuget_api_key: ${{ secrets.NUGET_API_KEY }}

  result:
    needs: [publish, tests]
    if: always() && github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
       - run: echo "Tests result = ${{ needs.tests.result }}"
       - run: echo "Pack & Publish result = ${{ needs.publish.result }}"

  # The manual path: unlist one version through Trusted Publishing. The policy must
  # include the "Unlist or relist package versions" scope.
  unlist:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # The OIDC token is minted in this job, so it carries this repository and
      # manage_package.yml, which is what the nuget.org policy matches.
      id-token: write

    steps:
      - uses: Stillpoint-Software/shared-workflows/.github/actions/unlist-package@main
        with:
          package_id: ${{ inputs.package_id }}
          package_version: ${{ inputs.package_version }}
          dry_run: ${{ inputs.dry_run }}
          nuget_user: ${{ secrets.NUGET_USER }}
